name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest numpy
      - run: ruff check .
      # Qwen adapter tests need torch + a model; skipped in CI
      - run: pytest -q tests -k "not QwenAdapter"
